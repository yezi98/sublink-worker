name: Sync Upstream & Deploy

on:
  schedule:
    - cron: '0 6 * * *'      # 每天北京时间 14:00 执行，可修改
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/7Sageer/sublink-worker.git || true
          git fetch upstream

          if git merge upstream/main --no-edit; then
            echo "Merge successful"
          else
            echo "Merge conflict detected!"
            exit 1
          fi

      - name: Push to origin
        run: git push origin main

      # ==================== 以下为部署部分 ====================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Check and Create KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE="SUBLINK_KV"
          echo "Checking for KV namespace: $KV_NAMESPACE"

          LIST_OUTPUT=$(wrangler kv namespace list --json 2>&1 || true)
          KV_ID=$(echo "$LIST_OUTPUT" | jq -r '.[] | select(.title == "sublink-worker-'$KV_NAMESPACE'") | .id' 2>/dev/null || true)

          if [ -z "$KV_ID" ]; then
            echo "Creating KV namespace..."
            CREATE_OUTPUT=$(wrangler kv namespace create "sublink-worker-$KV_NAMESPACE" 2>&1)
            KV_ID=$(echo "$CREATE_OUTPUT" | grep -o '[0-9a-f]\{32\}' | head -1)
            if [ -z "$KV_ID" ]; then
              echo "Failed to create KV: $CREATE_OUTPUT"
              exit 1
            fi
          fi
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Update wrangler.toml
        run: |
          WRANGLER_CONTENT=$(cat wrangler.toml)
          UPDATED_CONTENT=$(echo "$WRANGLER_CONTENT" | sed 's/id = "[^"]*"/id = "'$KV_ID'"/')
          echo "$UPDATED_CONTENT" > wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
