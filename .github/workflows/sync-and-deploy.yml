name: Sync Upstream & Deploy

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/7Sageer/sublink-worker.git || true
          git fetch upstream

          if git merge upstream/main --no-edit; then
            echo "Merge successful"
          else
            echo "Merge conflict detected, keeping upstream version..."
            git checkout --theirs .github/workflows/deploy.yml
            git add .github/workflows/deploy.yml
            git commit -m "Resolve conflict by keeping upstream version"
          fi

      - name: Push to origin
        run: git push origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Check and Create KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE="SUBLINK_KV"
          echo "Checking for KV namespace: $KV_NAMESPACE"

          # 检查是否已存在
          LIST_OUTPUT=$(wrangler kv namespace list 2>&1 || true)
          KV_ID=$(echo "$LIST_OUTPUT" | grep -o 'sublink-worker-'$KV_NAMESPACE'[[:space:]]*[0-9a-f]\{32\}' | grep -o '[0-9a-f]\{32\}' | head -1 || true)

          if [ -z "$KV_ID" ]; then
            echo "Creating KV namespace..."
            CREATE_OUTPUT=$(wrangler kv namespace create "sublink-worker-$KV_NAMESPACE" 2>&1 || true)
            KV_ID=$(echo "$CREATE_OUTPUT" | grep -o '[0-9a-f]\{32\}' | head -1 || true)

            if [ -z "$KV_ID" ]; then
              echo "Failed to create KV namespace. Full output:"
              echo "$CREATE_OUTPUT"
              exit 1
            fi
            echo "KV namespace created with ID: $KV_ID"
          else
            echo "KV namespace already exists with ID: $KV_ID"
          fi

          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Update wrangler.toml
        run: |
          WRANGLER_CONTENT=$(cat wrangler.toml)
          UPDATED_CONTENT=$(echo "$WRANGLER_CONTENT" | sed 's/id = "[^"]*"/id = "'$KV_ID'"/')
          echo "$UPDATED_CONTENT" > wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
