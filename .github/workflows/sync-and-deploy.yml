name: Sync Upstream & Deploy

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/7Sageer/sublink-worker.git || true
          git fetch upstream

          if git merge upstream/main -X theirs --no-edit; then
            echo "Merge successful"
          else
            echo "Merge conflict detected, resolved using upstream versions."
            git add .
            git commit -m "Resolve conflicts by prioritizing upstream changes"
          fi

      - name: Push to origin
        run: git push origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Check and Create KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          export NO_UPDATE_NOTIFIER=true # 屏蔽烦人的更新提示
          KV_NAMESPACE="SUBLINK_KV"
          echo "Checking for KV namespace: $KV_NAMESPACE"

          # 拿到包含了提示语的完整列表数据
          export RAW_LIST=$(wrangler kv namespace list 2>&1 || true)
          
          # 核心修复点：使用 Node.js 正则精准提取数组，彻底免疫非 JSON 文本的干扰
          KV_ID=$(node -e "
            try {
              const output = process.env.RAW_LIST;
              const match = output.match(/\[[\s\S]*\]/);
              if (match) {
                const arr = JSON.parse(match[0]);
                const kv = arr.find(x => x.title && x.title.includes('$KV_NAMESPACE'));
                if (kv) console.log(kv.id);
              }
            } catch(e) {}
          ")

          if [ -z "$KV_ID" ]; then
            echo "KV namespace not found. Trying to create..."
            CREATE_OUTPUT=$(wrangler kv namespace create "$KV_NAMESPACE" 2>&1 || true)
            
            # 使用正则从输出中硬抓取 32 位字符 ID
            KV_ID=$(echo "$CREATE_OUTPUT" | grep -o -i '[0-9a-f]\{32\}' | head -1 || true)

            if [ -z "$KV_ID" ]; then
              echo "Failed to create KV namespace. Output was:"
              echo "$CREATE_OUTPUT"
              exit 1
            fi
            echo "KV namespace created with ID: $KV_ID"
          else
            echo "✅ Successfully found existing KV namespace ID: $KV_ID"
          fi

          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Update wrangler.toml
        run: |
          sed -i -e 's/^[[:space:]]*id = "[^"]*"/id = "'$KV_ID'"/' wrangler.toml
          cat wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
